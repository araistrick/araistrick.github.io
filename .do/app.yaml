name: araistrick
region: nyc
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
domains:
  - domain: araistrick.com
    type: PRIMARY
  - domain: www.araistrick.com
    type: ALIAS
ingress:
  rules:
    - component:
        name: website
      match:
        path:
          prefix: /
static_sites:
  - name: website
    environment_slug: node-js
    github:
      repo: araistrick/araistrick.github.io
      branch: develop
      deploy_on_push: true
    build_command: npm ci && npx quartz build
    source_dir: /
    output_dir: public
    index_document: index.html
    error_document: 404.html
